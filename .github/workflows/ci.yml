name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The end-to-end suite launches the real app and drives it, so it needs a
  # window server: macOS runners have one, headless Linux runners do not.
  e2e:
    name: end-to-end (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: end-to-end (macOS)
        shell: bash
        run: |
          set +e
          npm run e2e > e2e.log 2>&1
          status=$?
          tail -c 20000 e2e.log
          # The failing lines travel as annotations as well: a job's log needs repository
          # rights to read, and the person looking at a red mark may not have them.
          if [ $status -ne 0 ]; then
            { grep -E '✗|e2e error|last lines of the app log' e2e.log | head -8
              grep -E '^    \|' e2e.log | head -8
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

  # The same suite on the other two systems, which is the only way the interface those
  # users see is ever exercised: what the window looks like, what the status line says, and
  # which pane a refusal offers were all macOS-only knowledge until these jobs existed.
  #
  # Both block a build now. They were non-blocking for their first runs, and those runs
  # earned it: the failures they produced were read (as annotations, because a job's log
  # needs rights a reader may not have) and every one of them was fixed — the runner's
  # missing shared libraries, five checks in the suite that were wrong about a system that
  # is not macOS, and one flake that asked the compositor where a window was instead of
  # asking the app whether it had asked for one.
  e2e-linux:
    name: end-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium's sandbox needs unprivileged user namespaces, which AppArmor refuses on
      # this runner by default — and the app itself is never given `--no-sandbox`.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A display, and the shared libraries Electron links against: without one of them the
      # process exits before a window exists, and the suite can only report that it waited.
      #
      # One package at a time, and only the display is fatal: the runner image's Ubuntu
      # release moves under this job (the label migrates between LTS versions), and its
      # package names move with it — `libasound2t64` is the 24.04 spelling of a library that
      # was `libasound2` before and may be either after. A rename must not turn the job red;
      # a missing library will, in the suite, with the app's own log beside it.
      - name: the display and the libraries Electron needs
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          missing=()
          for package in libnss3 libatk-bridge2.0-0 libgbm1 libgtk-3-0 libasound2t64 libasound2; do
            sudo apt-get install -y --no-install-recommends "$package" 2>/dev/null || missing+=("$package")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "not in this image (fine if the library came with another name): ${missing[*]}"
          fi
      - name: end-to-end (Linux)
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum npm run e2e > e2e.log 2>&1
          status=$?
          tail -c 20000 e2e.log
          # A job's log needs repository rights to read; the annotations it writes do not.
          # A red run on a runner nobody can log into has to carry its own reason.
          if [ $status -ne 0 ]; then
            { grep -E '✗|e2e error|last lines of the app log' e2e.log | head -8
              grep -E '^    \|' e2e.log | head -8
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

  e2e-windows:
    name: end-to-end (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: end-to-end (Windows)
        shell: bash
        run: |
          set +e
          npm run e2e > e2e.log 2>&1
          status=$?
          tail -c 20000 e2e.log
          # Same as the Linux job: what a failing run has to say travels as annotations,
          # because the log itself needs rights the person reading the red mark may not have.
          if [ $status -ne 0 ]; then
            { grep -E '✗|e2e error|last lines of the app log' e2e.log | head -8
              grep -E '^    \|' e2e.log | head -8
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

  package:
    name: package check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
            artifacts: |
              dist/*.dmg
          - name: Windows
            os: windows-latest
            target: win
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      # The deb metadata wants a project URL; CI is the only place that knows it.
      # The shell is named because the default on Windows is PowerShell, where
      # ${GITHUB_SERVER_URL} is a PowerShell variable and not the environment one —
      # the value came out empty and npm refused it.
      - shell: bash
        run: npm pkg set homepage="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      # Packaging is the slowest failure to discover, so it is checked on every
      # push rather than only when a release tag is cut. Each platform packages
      # best on its own system: a deb needs dpkg, an AppImage needs appimagetool.
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7
