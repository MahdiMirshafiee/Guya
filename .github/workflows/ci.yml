name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The end-to-end suite launches the real app and drives it, so it needs a
  # window server: macOS runners have one, headless Linux runners do not.
  e2e:
    name: end-to-end (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e

  package:
    name: package check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
            artifacts: |
              dist/*.dmg
              dist/*-mac.zip
          - name: Windows
            os: windows-latest
            target: win
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      # The deb metadata wants a project URL; CI is the only place that knows it.
      - run: npm pkg set homepage="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      # Packaging is the slowest failure to discover, so it is checked on every
      # push rather than only when a release tag is cut. Each platform packages
      # best on its own system: a deb needs dpkg, an AppImage needs appimagetool.
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7
