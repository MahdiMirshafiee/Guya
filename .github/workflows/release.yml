name: Release

# A tag is the release: three platforms, one release page. `scripts/release.sh 1.2.0` bumps the version, commits it,
# tags it and pushes — and this workflow turns that tag into published artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty for a dry run that only builds)'
        required: false

permissions:
  contents: write

jobs:
  verify:
    name: verify the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag and package.json agree
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json v$version — release with scripts/release.sh $version"
            exit 1
          fi

  build:
    name: build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - name: Windows
            os: windows-latest
            target: win
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      # The deb metadata wants a project URL; CI is the only place that knows it.
      # The shell is named because the default on Windows is PowerShell, where
      # ${GITHUB_SERVER_URL} is a PowerShell variable and not the environment one —
      # the value came out empty and npm refused it.
      - shell: bash
        run: npm pkg set homepage="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      # Signing is one secret away: set CSC_LINK and CSC_KEY_PASSWORD (macOS) or
      # the Windows equivalent and electron-builder picks them up. Without them
      # the artifacts build unsigned, which is what a local build produces too.
      #
      # Both architectures of each system, not just the one the runner happens to be —
      # but one invocation per architecture, which is not the same thing as one
      # invocation with both flags: handed several architectures at once, NSIS packs
      # them into a single installer (190 MB for a machine that can run half of it),
      # while every other target quietly makes one file each. Two runs, four Windows
      # files, and every name says which architecture it is.
      - name: Package both architectures
        shell: bash
        run: |
          npx electron-builder --${{ matrix.target }} --x64 --publish never
          npx electron-builder --${{ matrix.target }} --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: guya-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish the release
    needs: [verify, build]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # The checkout comes first: it cleans the workspace, so anything downloaded
      # before it would be deleted — which is exactly what happened to the installers.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are written from the commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write the release notes
        shell: bash
        run: node scripts/notes.js "${{ github.event.inputs.tag || github.ref_name }}" > notes.md
      - name: Create the release and attach the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # A while-read loop rather than mapfile: mapfile does not exist in the bash
          # that ships on macOS, which is the difference between a step that can be
          # reproduced on a laptop and one that only runs on the runner.
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          printf 'attaching:\n%s\n' "${files[@]}"
          # The publish itself is scripts/publish-release.sh: it creates the release, or
          # re-cuts one that is already there, and `--repo` is why it needs to exist —
          # this job checks the repository out, but the script is also run by hand.
          scripts/publish-release.sh "$tag" notes.md "${files[@]}"
