name: Release

# A tag is the release: three platforms, one release page. `scripts/release.sh 1.2.0` bumps the version, commits it,
# tags it and pushes — and this workflow turns that tag into published artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty for a dry run that only builds)'
        required: false

permissions:
  contents: write

jobs:
  verify:
    name: verify the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag and package.json agree
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json v$version — release with scripts/release.sh $version"
            exit 1
          fi

  build:
    name: build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - name: Windows
            os: windows-latest
            target: win
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      # The deb metadata wants a project URL; CI is the only place that knows it.
      # The shell is named because the default on Windows is PowerShell, where
      # ${GITHUB_SERVER_URL} is a PowerShell variable and not the environment one —
      # the value came out empty and npm refused it.
      - shell: bash
        run: npm pkg set homepage="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      # Signing is one secret away: set CSC_LINK and CSC_KEY_PASSWORD (macOS) or
      # the Windows equivalent and electron-builder picks them up. Without them
      # the artifacts build unsigned, which is what a local build produces too.
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: guya-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish the release
    needs: [verify, build]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # The checkout comes first: it cleans the workspace, so anything downloaded
      # before it would be deleted — which is exactly what happened to the installers.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are written from the commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write the release notes
        shell: bash
        run: node scripts/notes.js "${{ github.event.inputs.tag || github.ref_name }}" > notes.md
      - name: Create the release and attach the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # A while-read loop rather than mapfile: mapfile does not exist in the bash
          # that ships on macOS, which is the difference between a step that can be
          # reproduced on a laptop and one that only runs on the runner.
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          printf 'attaching:\n%s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers were downloaded from the build jobs"
            exit 1
          fi
          # --repo is not optional here: this job never checks the repository out, so
          # there is no working tree for gh to read the remote from — and without it
          # every release failed with "not a git repository".
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Guya $tag" --notes-file notes.md
          fi
